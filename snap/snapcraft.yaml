name: tmiix
title: Tmiix
base: core22
adopt-info: tmiix
summary: Tmux and SSH session manager
description: |
  Tmiix is a terminal with builtin tmux, ssh and snippets support.
  Tmiix manages local and remote tmux sessions in a beautiful, intuitive, fast UI.

grade: stable
confinement: strict
compression: lzo

parts:
  tmiix:
    plugin: dump
    source: snap/local
    override-build: |
      craftctl default
      version="$(sed -n 's/^  version: //p' "$CRAFT_PROJECT_DIR/wails.yaml")"
      craftctl set version="$version"
    organize:
      tmiix: bin/tmiix
      jp.nonbili.tmiix.desktop: usr/share/applications/jp.nonbili.tmiix.desktop
      jp.nonbili.tmiix.png: usr/share/icons/hicolor/512x512/apps/jp.nonbili.tmiix.png
    stage-packages:
      - tmux
      - openssh-client

apps:
  tmiix:
    command: bin/tmiix
    extensions: [gnome]
    desktop: usr/share/applications/jp.nonbili.tmiix.desktop
    plugs:
      - home
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - browser-support
      - audio-playback
      - ssh-keys
      - dot-ssh-config
      - dot-config-tmiix

plugs:
  dot-ssh-config:
    interface: personal-files
    read:
      - $HOME/.ssh/config
  dot-config-tmiix:
    interface: personal-files
    write:
      - $HOME/.config/tmiix

slots:
  tmiix:
    interface: dbus
    bus: session
    name: jp.nonbili.tmiix
