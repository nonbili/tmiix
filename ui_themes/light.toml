# Default light UI theme. See dark.toml for schema notes.

color_scheme = "light"

[colors]
background        = "#f8fafc"
surface           = "#eef2f6"
elevated          = "#e2e8f0"
muted             = "#cbd5e1"

foreground        = "#24292f"
foreground-strong = "#1f2328"
foreground-muted  = "#4b5563"
foreground-subtle = "#6b7280"

border            = "#c7d0da"
border-strong     = "#94a3b8"

accent            = "#0969da"
accent-muted      = "#218bff"
accent-soft       = "rgba(9,105,218,0.12)"
overlay           = "rgba(71,85,105,0.34)"

term-green  = "#1a7f37"
term-yellow = "#9a6700"
term-red    = "#cf222e"
