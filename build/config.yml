version: '3'

info:
  companyName: Nonbili Inc.
  productName: Tmiix
  productIdentifier: jp.nonbili.tmiix
  description: The missing tmux GUI
  version: "0.1.4"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .wails, .task, node_modules, frontend, build, tmiix-snap-test, .antigravitycli]
    file: [.DS_Store, .gitignore, .gitkeep, "*_test.go"]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
